openapi: 3.1.0
info:
  title: katalog-api
  version: 0.0.1
  description: |
    Read-only catalog REST surface for the zaentrum platform.
servers:
  - url: https://katalog-api.example.com
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: ok
  /api/v1/items:
    get:
      summary: List catalog items
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
  /api/v1/items/{id}:
    get:
      summary: Get one catalog item by id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: include
          description: >
            Comma-separated associations to fold in: genres, people (alias
            cast), subtitles, trailers, segments. Unknown tokens are ignored.
          schema:
            type: string
          example: genres,people
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
  /api/v1/people:
    get:
      summary: Search people by name
      description: >
        Accent- and case-insensitive substring match, ranked exact name, then
        name prefix, then most titles, then name. An empty q answers an empty
        list.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching people
          content:
            application/json:
              schema:
                type: object
                required: [people, total]
                properties:
                  people:
                    type: array
                    items:
                      $ref: "#/components/schemas/Person"
                  total:
                    type: integer
  /api/v1/people/{id}:
    get:
      summary: Get a person, their details and their filmography
      description: >
        The filmography is one card per title the person is credited on,
        newest first, each with the person's roles on it. The biography is
        one text: in the language `lang` names, else the first language of
        Accept-Language (by quality) the catalog has a text in, else English,
        else the first language that has one. The response varies on
        Accept-Language.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: limit
          description: Filmography size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - in: query
          name: lang
          description: >
            Biography language as a language tag; its primary subtag is used
            (de-CH asks for de). Overrides Accept-Language.
          schema:
            type: string
          example: de
        - in: header
          name: Accept-Language
          schema:
            type: string
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetail"
        "404":
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Item:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
        type:
          type: string
          example: movie
        title:
          type: string
        sort_title:
          type: string
        year:
          type: integer
        rating:
          type: number
        description:
          type: string
        tagline:
          type: string
        duration_ms:
          type: integer
        season_number:
          type: integer
        episode_number:
          type: integer
        parent_id:
          type: string
        genres:
          type: array
          items:
            type: string
        cast:
          description: >
            With include=people. A title's credits, role by role in the
            order actor, creator, director, writer, producer, composer,
            cinematographer, editor, then any other role alphabetically;
            within a role by billing order (unbilled last), then name. At
            most 20 actors and 10 people of every other role.
          type: array
          items:
            $ref: "#/components/schemas/CastEntry"
        roles:
          description: >
            On a person's filmography only: the person's roles on this item,
            in the cast's role order.
          type: array
          items:
            type: string
    CastEntry:
      type: object
      required: [name, role]
      description: One credit. Every optional field is omitted when unknown.
      properties:
        person_id:
          type: string
        name:
          type: string
        role:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,39}$"
          description: >
            Open vocabulary. Well known: actor, creator, director, writer,
            producer, composer, cinematographer, editor. A client may skip
            roles it does not know.
        job:
          type: string
          description: The job within the role.
          example: Screenplay
        character:
          type: string
          description: The part an actor plays.
        order:
          type: integer
          minimum: 0
          description: Billing order within the role, 0 first.
        episode_count:
          type: integer
          description: How many episodes of a series the credit covers.
    Person:
      type: object
      required: [id, name, has_profile]
      properties:
        id:
          type: string
        name:
          type: string
        credits:
          type: integer
          description: Search results only. The number of titles credited.
        has_profile:
          type: boolean
          description: >
            The catalog holds the person's primary portrait, served by the
            catalog manager at /api/artwork/person/{id}/profile.
    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [items]
          description: Every optional field is omitted when unknown.
          properties:
            sort_name:
              type: string
            also_known_as:
              type: array
              items:
                type: string
            birth_date:
              type: string
              format: date
            death_date:
              type: string
              format: date
            birthplace:
              type: string
            known_for_department:
              type: string
              example: Acting
            biography:
              type: string
            biography_lang:
              type: string
              description: The biography's language, a primary language subtag.
              example: en
            tmdb_person_id:
              type: string
            imdb_id:
              type: string
            items:
              type: array
              items:
                $ref: "#/components/schemas/Item"
    ItemPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        nextCursor:
          type: string
