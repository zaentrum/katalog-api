openapi: 3.1.0
info:
  title: katalog-api
  version: 0.0.1
  description: |
    Read-only catalog REST surface for the zaentrum platform.

    A viewer with a rating cap is served only what the cap allows, on every
    route behind the bearer: the cap is the stricter of the bearer's
    `max_rating` claim (a whole number of years) and the `max_rating`
    parameter a BFF passes. A title rated above it, and one nothing rates
    unless the catalog's setting `ratings.unrated_for_capped` says `show`, is
    as if the catalog did not hold it: left out of a list and its total, and
    404 by id, as an id there is not. An episode is rated as its series
    unless an admin rated it. A cap that is no whole number of years is the
    strictest, 0. The holdings (`/api/v1/holdings`) are the library's and are
    not filtered: a capped request is refused them (403).
servers:
  - url: https://katalog-api.example.com
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: ok
  /api/v1/search:
    get:
      summary: Search the catalog
      description: >
        One search of the catalog: its titles, films, series and episodes
        ranked together by how they match the query, best first, and the
        people whose names match it, ranked apart. A title, a name and a plot
        are read normalized: lower case, accents off, apostrophes dropped,
        every other mark a space, and with the marks inside a word dropped
        too ("widows bay", "widow's bay" and "Widow´s Bay" are one; "leon"
        finds "Léon", "spiderman" "Spider-Man"). The tiers of a title, best
        first, each its match:
        exact (the title is the query);
        prefix (the title begins with the query, word by word: each word of
        the query begins the word of the title in its place, so "widow b"
        begins "Widow's Bay");
        words (every word of the query begins a word of the title, in any
        order);
        alternative (... of a series' other name, the one the library files
        it under);
        then the episodes whose titles match so, after every film and series;
        similar (the title is close to the query, a typo: only while the
        tiers above fill no page; films and series before episodes);
        plot (every word of the query begins a word of the plot: only when no
        title matched by the tiers above it, typos aside).
        Within a tier a title is ranked by how close its title is to the
        query (trigram similarity), then by its rating, then by its title. A
        query shorter than three characters reads the beginnings of titles
        and names alone. A person is ranked by the same tiers of their name
        (alternative: another name they are known by; no plot), and within a
        tier by the titles that credit them, then how close the name is, then
        the name; a person credited on no title is not found. A capped viewer
        is served what the cap allows: a person's credits count the titles it
        allows. Until katalog-manager's migration 049 is in place (it builds
        the indexes in the background after it starts), titles match as the
        list endpoints matched them before it (a match of words each, by the
        catalog's search vector or else the title) and people as GET /people
        finds them, without a match.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MaxRating"
        - in: query
          name: q
          description: The query. A blank one finds nothing.
          schema:
            type: string
          example: widows bay
        - in: query
          name: types
          description: >
            The types of title to look at, comma separated; the parameter may
            repeat. Unknown types are ignored; none named is all three.
          schema:
            type: string
            default: movie,series,episode
          example: movie,series
        - in: query
          name: limit
          description: How many titles.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - in: query
          name: people
          description: How many people; 0 looks for none.
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 12
      responses:
        "200":
          description: The titles and the people found, best first
          content:
            application/json:
              schema:
                type: object
                required: [items, people]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  people:
                    type: array
                    items:
                      $ref: "#/components/schemas/Person"
  /api/v1/items:
    get:
      summary: List catalog items
      description: >
        Every type's items, and with q those that match it by their title, a
        series' other name or their plot, read as /api/v1/search reads them
        (before katalog-manager's migration 049, by the catalog's search
        vector, else the title). The type lists (/api/v1/movies, /series,
        /episodes, /albums) take the same parameters; on /movies, /series and
        /episodes a q without a filter (genre, year_min, year_max,
        rating_min) or an order of its own (sort other than title) is ranked
        as /api/v1/search ranks the titles of that type, and total counts what
        that search found.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MaxRating"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: genre
          schema:
            type: string
        - in: query
          name: year_min
          schema:
            type: integer
        - in: query
          name: year_max
          schema:
            type: integer
        - in: query
          name: rating_min
          schema:
            type: number
        - in: query
          name: sort
          schema:
            type: string
            enum: [title, rating, year, newest]
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
  /api/v1/items/{id}:
    get:
      summary: Get one catalog item by id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/MaxRating"
        - in: query
          name: include
          description: >
            Comma-separated associations to fold in: genres, people (alias
            cast), subtitles, trailers, extras, segments. Unknown tokens are
            ignored. The subtitles and the segments are of the file the item
            plays: an episode covered by another's file (coveredBy) is served
            its holder's.
          schema:
            type: string
          example: genres,people
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found, or a title the viewer's rating cap leaves out
  /api/v1/visible:
    get:
      summary: Which titles a viewer with a rating cap may be served
      description: >
        For the requests a stream token authorizes, which carry the viewer's
        cap but no bearer: the ids asked about, in their order and each once,
        that name a title a viewer capped at max_rating may be served. An id
        of no title is left out as one the cap leaves out. It takes no bearer:
        the Service is in-cluster only, as for the stream services' asset
        lookups.
      parameters:
        - in: query
          name: ids
          description: Comma-separated item ids, at most 500; the parameter may repeat.
          schema:
            type: string
        - in: query
          name: max_rating
          required: true
          description: The cap, a whole number of years; anything else is the strictest cap, 0.
          schema:
            type: string
          example: "12"
      responses:
        "200":
          description: The ids the cap allows
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids:
                    type: array
                    items:
                      type: string
        "400":
          description: No max_rating, or more than 500 ids
  /api/v1/items/{id}/playback:
    get:
      summary: Where an item's package and its original are (internal)
      description: >
        For the stream services, which play what it names: the package that
        plays, the superseded versions a running session may still finish
        on, and the file the item was taken in from while there is one.
        katalog-manager records every path of the library, so a stream
        service computes none. Before katalog-manager's migration 040, and for
        an item packaged before the library, the package is the folder of the
        item's packaged asset, read by its manifest.json, with no version and
        nothing previous; so too while the role may not read the versions.
        An episode held in the file of another, its holder (katalog-manager's
        migration 045), is answered the holder's package, previous versions
        and original, and names the holder in coveredBy: it plays exactly
        when the holder does. It applies no rating cap and takes no bearer:
        the Service is in-cluster only, as for the asset lookups.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Where the item plays from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playback"
        "404":
          description: No such item
  /api/v1/extras/{extraId}/playback:
    get:
      summary: Where an extra's package is (internal)
      description: >
        For the stream services: the folder of an extra's package, the record
        to read it by, the title it belongs to and when it was packaged. An
        extra plays by its id while it is packaged and not removed, also when
        it is hidden or its original went missing. It takes no bearer: the
        Service is in-cluster only, as for the asset lookups.
      parameters:
        - in: path
          name: extraId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Where the extra plays from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraPlayback"
        "404":
          description: No such extra, or one never packaged, or removed
  /api/v1/packaged-ids:
    get:
      summary: Which movies and episodes have a package (internal)
      description: >
        For the stream services: the ids of the movies and episodes that have
        a packaged asset, in id order, before the library and in it alike. An
        episode held in the file of another is listed when its holder has
        one. It takes no bearer: the Service is in-cluster only, as for the
        asset lookups.
      responses:
        "200":
          description: The packaged ids
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids:
                    type: array
                    items:
                      type: string
  /api/v1/holdings:
    get:
      summary: What the library holds, by identity
      description: >
        For a service that thinks in the identities titles have outside the
        catalog (a TMDB, TVDB or IMDb id) and holds no catalog ids, such as an
        addon. With an identity, the series that carries it, season by season
        (SeriesHoldings), or the movie (MovieHolding); without, a page of every
        title of the type (HoldingsPage). One identity is enough, and one no
        title carries does not keep the others from finding it; identities
        that name different titles are 400. A tmdb id names a title with its
        type: TMDB numbers films and shows apart. A title the catalog holds
        twice is answered as one: a series as the first of them made, with the
        episodes of each; a movie as the one that plays, else one with a file,
        else the first made. Any bearer the verifier admits reads them, a
        signed-in person's and an addon's service account's alike. They are
        the library's, unfiltered by any rating, and say what is held, never
        what anyone wants: a request capped at an age, by the bearer's
        max_rating claim or the max_rating parameter, is refused (403) rather
        than served them.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [series, movie]
        - in: query
          name: tmdb
          description: The title's TMDB id, a number (a series' is its show's).
          schema:
            type: string
            pattern: "^[0-9]{1,20}$"
          example: "97546"
        - in: query
          name: tvdb
          description: The series' TVDB id, a number. A series only.
          schema:
            type: string
            pattern: "^[0-9]{1,20}$"
          example: "362392"
        - in: query
          name: imdb
          description: The title's IMDb id.
          schema:
            type: string
            pattern: "^tt[0-9]{1,20}$"
          example: tt9208876
        - in: query
          name: page
          description: The page of the listing, from 1. Without an identity only.
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          description: Titles a page of the listing holds. Without an identity only.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: The series' holdings, the movie's, or a page of the listing
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SeriesHoldings"
                  - $ref: "#/components/schemas/MovieHolding"
                  - $ref: "#/components/schemas/HoldingsPage"
        "400":
          description: >
            A request the holdings cannot answer, and why: no type or another
            one; an identity the type is not looked up by (tvdb for a movie),
            empty, malformed, or given twice with two values; identities that
            name different titles; page or pageSize no whole number in range,
            a page past the last, or either with an identity; a parameter the
            holdings do not take.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {"error": "tmdb 97546 and tvdb 81189 name different series"}
        "401":
          description: No bearer, or one that does not verify
        "403":
          description: >
            A token for an audience not allowed, or a request capped at an
            age (with {"error": "..."})
        "404":
          description: No title of the type carries any of the identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {"error": "no series has tmdb 97546"}
        "503":
          description: >
            The issuer cannot be reached yet, or the role may not read the
            catalog's identities (with {"error": "..."})
  /api/v1/people:
    get:
      summary: Search people by name
      description: >
        Accent- and case-insensitive substring match, ranked exact name, then
        name prefix, then most titles, then name. An empty q answers an empty
        list. For a capped viewer a person's titles are those the cap allows,
        and one credited in none of them is not found.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MaxRating"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching people
          content:
            application/json:
              schema:
                type: object
                required: [people, total]
                properties:
                  people:
                    type: array
                    items:
                      $ref: "#/components/schemas/Person"
                  total:
                    type: integer
  /api/v1/people/{id}:
    get:
      summary: Get a person, their details and their filmography
      description: >
        The filmography is one card per title the person is credited on,
        newest first, each with the person's roles on it. The biography is
        one text: in the language `lang` names, else the first language of
        Accept-Language (by quality) the catalog has a text in, else English,
        else the first language that has one. The response varies on
        Accept-Language. A capped viewer's filmography leaves out the titles
        the cap does not allow.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/MaxRating"
        - in: query
          name: limit
          description: Filmography size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - in: query
          name: lang
          description: >
            Biography language as a language tag; its primary subtag is used
            (de-CH asks for de). Overrides Accept-Language.
          schema:
            type: string
          example: de
        - in: header
          name: Accept-Language
          schema:
            type: string
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetail"
        "404":
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MaxRating:
      in: query
      name: max_rating
      description: >
        The viewer's rating cap, a whole number of years, as a BFF passes it;
        the stricter of it and the bearer's max_rating claim applies. Anything
        else is the strictest cap, 0. Every route behind the bearer takes it.
      schema:
        type: string
      example: "12"
  schemas:
    Item:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
        type:
          type: string
          example: movie
        title:
          type: string
        sort_title:
          type: string
        year:
          type: integer
        rating:
          type: number
        description:
          type: string
        tagline:
          type: string
        duration_ms:
          type: integer
        season_number:
          type: integer
        episode_number:
          type: integer
        parent_id:
          type: string
        coveredBy:
          type: string
          description: >
            On an episode held in the file of another (katalog-manager's
            migration 045): the id of the file's holder, the first episode it
            holds, whose package, original, subtitles and segments it plays.
            Omitted on every other item.
        covers:
          type: array
          items:
            type: string
          description: >
            On the holder of a file that holds several episodes: the ids of
            the other episodes it holds, in episode order. Omitted on every
            other item.
        episodeEnd:
          type: integer
          description: >
            On the holder of a file that holds several episodes: the number of
            the last episode it holds. Omitted on every other item.
          example: 10
        externalIds:
          $ref: "#/components/schemas/ExternalIds"
          description: >
            The identities the title has outside the catalog, on every read
            of an item. Omitted when the catalog keeps none, and while the
            role may not read them.
        min_age:
          type: integer
          minimum: 0
          maximum: 21
          description: >
            The age a viewer must be to be served the title: an admin's rating
            of it, else (for an episode) its series' rating, else the minimum
            age its certification means. Omitted when nothing rates it; 0 is
            sent.
        certification:
          type: string
          description: >
            The certification the age comes from, as TMDB gives it in its
            country (an episode's is its series'); omitted when an admin rated
            the title by hand, or nothing rates it.
          example: PG-13
        certification_country:
          type: string
          description: The certification's country, ISO 3166-1 alpha-2.
          example: US
        genres:
          type: array
          items:
            type: string
        cast:
          description: >
            With include=people. A title's credits, role by role in the
            order actor, creator, director, writer, producer, composer,
            cinematographer, editor, then any other role alphabetically;
            within a role by billing order (unbilled last), then name. At
            most 20 actors and 10 people of every other role.
          type: array
          items:
            $ref: "#/components/schemas/CastEntry"
        extras:
          description: >
            With include=extras, on a movie or a series. Its extras that play:
            bonus material that is a file of its own, packaged for streaming
            (an extra plays once it is packaged, until it is removed, unless it
            is hidden: the scanner hides one whose file went missing; while it is packaged
            anew, the package it had plays on). In the order a viewer sees
            them: by the place they are given (those without one last; nothing
            sets one yet), then as they were taken in. Omitted when none plays, and on a
            catalog that has no extras yet (katalog-manager's migration 039,
            or SELECT on its table, missing). The item's links to online
            videos are apart from these (include=trailers). A viewer whose
            rating cap leaves the item out gets neither the item nor its
            extras: 404.
          type: array
          items:
            $ref: "#/components/schemas/Extra"
        roles:
          description: >
            On a person's filmography only: the person's roles on this item,
            in the cast's role order.
          type: array
          items:
            type: string
        match:
          description: >
            On a search's titles only (and a type's list ranked as one): how
            the title matched the query, its tier. An episode ranks after
            every film and series its match would put it beside.
          type: string
          enum: [exact, prefix, words, alternative, similar, plot]
        series:
          description: >
            On an episode a search found: its series (its parent, or its
            parent's when the parent is a season), and whether the series
            matched the query by its own title in the same search, so that a
            client can show the two as one.
          type: object
          required: [id, title, matched]
          properties:
            id:
              type: string
            title:
              type: string
            matched:
              type: boolean
    ExternalIds:
      type: object
      description: >
        The identities a title has outside the catalog, as enrichment found
        them: for each source the catalog keeps an id of it in, keyed as
        stored, that id. The sources in use are tmdb, tvdb and imdb for a
        film or a series, and tmdb-episode for an episode. Of two ids of one
        source the catalog keeps for a title, the same one is sent every time.
      additionalProperties:
        type: string
      example: {"tmdb": "97546", "tvdb": "362392", "imdb": "tt9208876"}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What is wrong, in a sentence.
    SeriesHoldings:
      type: object
      required: [seriesId, title, year, externalIds, seasons]
      properties:
        seriesId:
          type: string
        title:
          type: string
        year:
          type: [integer, "null"]
        externalIds:
          $ref: "#/components/schemas/ExternalIds"
        seasons:
          type: array
          description: >
            In season order, the specials (0) among them; empty for a series
            the catalog holds no episode of. An episode without a season or an
            episode number has no place among them and is left out.
          items:
            $ref: "#/components/schemas/SeasonHoldings"
    SeasonHoldings:
      type: object
      required: [season, episodes]
      properties:
        season:
          type: integer
          minimum: 0
        episodes:
          type: array
          description: Every episode the catalog holds of the season, in episode order.
          items:
            $ref: "#/components/schemas/EpisodeHolding"
    EpisodeHolding:
      type: object
      required: [episode, itemId, hasFile, playable, coveredBy]
      properties:
        episode:
          type: integer
        itemId:
          type: string
        hasFile:
          type: boolean
          description: >
            The catalog records a file for it: the file it was taken in from
            (as /api/v1/items/{id}/asset answers it) or its package. An
            original retired after packaging is no file.
        playable:
          type: boolean
          description: It is packaged, as /api/v1/packaged-ids says.
        coveredBy:
          type: [string, "null"]
          description: >
            On an episode held in the file of another (katalog-manager's
            migration 045): the holder, whose hasFile and playable these are.
            null on every other episode.
    MovieHolding:
      type: object
      required: [itemId, title, year, externalIds, hasFile, playable]
      properties:
        itemId:
          type: string
        title:
          type: string
        year:
          type: [integer, "null"]
        externalIds:
          $ref: "#/components/schemas/ExternalIds"
        hasFile:
          type: boolean
          description: The catalog records a file for it, as for an episode.
        playable:
          type: boolean
          description: It is packaged.
    HoldingsPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          description: >
            Every title of the type, in id order, which renaming a title does
            not change.
          items:
            $ref: "#/components/schemas/TitleHolding"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: How many titles of the type the catalog holds.
    TitleHolding:
      type: object
      required: [itemId, title, year, externalIds]
      properties:
        itemId:
          type: string
        title:
          type: string
        year:
          type: [integer, "null"]
        externalIds:
          $ref: "#/components/schemas/ExternalIds"
          description: "{} for a title the catalog keeps no identity of."
        heldEpisodes:
          type: integer
          description: >
            On a series only: how many of its episodes have a file, as its
            holdings count them.
    CastEntry:
      type: object
      required: [name, role]
      description: One credit. Every optional field is omitted when unknown.
      properties:
        person_id:
          type: string
        name:
          type: string
        role:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,39}$"
          description: >
            Open vocabulary. Well known: actor, creator, director, writer,
            producer, composer, cinematographer, editor. A client may skip
            roles it does not know.
        job:
          type: string
          description: The job within the role.
          example: Screenplay
        character:
          type: string
          description: The part an actor plays.
        order:
          type: integer
          minimum: 0
          description: Billing order within the role, 0 first.
        episode_count:
          type: integer
          description: How many episodes of a series the credit covers.
    Extra:
      type: object
      required: [id, kind, title]
      description: One extra of a movie or a series. Every optional field is omitted when unknown.
      properties:
        id:
          type: string
          format: uuid
          description: The extra's id, which its playback path names.
        kind:
          type: string
          description: >
            One of featurette, behind-the-scenes, making-of, deleted-scene,
            interview, trailer, teaser, gag-reel, short, other. A client may
            skip kinds it does not know.
          example: trailer
        title:
          type: string
          description: >
            What a viewer sees: its label when one is set (nothing sets one
            yet), else the title it was taken in with.
          example: Trailer
        language:
          type: string
          description: The language spoken in it, as taken in — BCP 47 or ISO 639-2 (en, eng; zxx, none).
          example: en
        duration_ms:
          type: integer
          example: 33000
        season_number:
          type: integer
          minimum: 0
          description: >
            On a series' extra that belongs to a season only: that season, 0
            for the specials. Omitted for an extra of the series as a whole,
            and of a movie.
    Person:
      type: object
      required: [id, name, has_profile]
      properties:
        id:
          type: string
        name:
          type: string
        credits:
          type: integer
          description: Search results only. The number of titles credited.
        has_profile:
          type: boolean
          description: >
            The catalog holds the person's primary portrait, served by the
            catalog manager at /api/artwork/person/{id}/profile.
        match:
          type: string
          enum: [exact, prefix, words, alternative, similar]
          description: >
            On /api/v1/search only: how the name matched the query
            (alternative: another name the person is known by).
    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [items]
          description: Every optional field is omitted when unknown.
          properties:
            sort_name:
              type: string
            also_known_as:
              type: array
              items:
                type: string
            birth_date:
              type: string
              format: date
            death_date:
              type: string
              format: date
            birthplace:
              type: string
            known_for_department:
              type: string
              example: Acting
            biography:
              type: string
            biography_lang:
              type: string
              description: The biography's language, a primary language subtag.
              example: en
            tmdb_person_id:
              type: string
            imdb_id:
              type: string
            items:
              type: array
              items:
                $ref: "#/components/schemas/Item"
    ItemPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Playback:
      type: object
      required: [itemId, type, package, previous, original]
      properties:
        itemId:
          type: string
        type:
          type: string
          example: movie
        coveredBy:
          type: string
          description: >
            On an episode held in the file of another: the id of the file's
            holder, whose package, previous versions and original these are.
            Omitted for every other item, the holder among them.
        package:
          description: >
            The package that plays: the item's complete version, else (before
            the library) its packaged asset's folder. null when the item has
            no package; a series has none.
          oneOf:
            - $ref: "#/components/schemas/PackageRef"
            - type: "null"
        previous:
          description: >
            The item's superseded versions that are not removed yet, the one
            superseded last first: a session started on one may finish on it.
            Empty before the library.
          type: array
          items:
            $ref: "#/components/schemas/PackageRef"
        original:
          description: >
            The file the item was taken in from (its primary asset); null once
            it was retired after packaging, or when there is none.
          oneOf:
            - $ref: "#/components/schemas/Original"
            - type: "null"
    PackageRef:
      type: object
      required: [versionId, dir, record]
      description: One package's folder and the record in it to read the package by.
      properties:
        versionId:
          type: [string, "null"]
          description: The version it is; null for a package from before the library.
        dir:
          type: string
          example: /var/lib/katalog/movies/f0/f001aeff-9c18-4183-b51b-51403af2515e/versions/9a2e4f60-1b2c-4d3e-8f4a-5b6c7d8e9f00
        record:
          type: string
          enum: [package.json, manifest.json]
          description: package.json for a version, manifest.json for a package from before the library.
        completedAt:
          type: string
          format: date-time
          description: >
            When the complete version was completed, in UTC. Omitted for a
            previous version and for a package from before the library.
    Original:
      type: object
      required: [path, sourceId]
      properties:
        path:
          type: string
          example: /var/lib/katalog/.work/incoming/Sintel (2010).mkv
        sourceId:
          type: [string, "null"]
          description: The source the file is; null when the catalog does not say.
    ExtraPlayback:
      type: object
      required: [extraId, itemId, dir, record, packagedAt]
      properties:
        extraId:
          type: string
        itemId:
          type: string
          description: The movie or series the extra belongs to.
        dir:
          type: string
          example: /var/lib/katalog/movies/ea/ea886f9b-0d06-4f0f-babb-d2a1162f9b01/extras/2b7c9e10-3d4f-4a5b-8c6d-7e8f9a0b1c2d
        record:
          type: string
          enum: [package.json, manifest.json]
          description: >
            package.json for an extra packaged into its title's folder in the
            library, manifest.json for one in the package store.
        packagedAt:
          type: string
          format: date-time
          description: When it was packaged, in UTC.
